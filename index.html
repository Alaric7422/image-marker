
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Numbering Web App</title>
    <style>
        :root {
            --bg-color: #2b2b2b;
            --button-bg: #3c3f41;
            --button-fg: #ffffff;
            --button-active-bg: #4c5052;
            --button-mode-active-bg: #6495ED; /* Cornflower blue for active mode */
            --canvas-bg: #1e1e1e;
            --status-success-bg: green;
            --status-error-bg: red;
            --status-fg: #ffffff;
            --text-color: #f0f0f0;
            --input-bg: #3c3f41;
            --input-border: #555;
            --modal-bg: #333333;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden; /* Prevent body scroll, especially on mobile */
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center; /* Horizontally center toolbar items */
            padding: 6px; /* Slightly reduced padding */
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--button-bg);
            gap: 6px; /* Slightly reduced gap */
        }

        .toolbar button, .toolbar input[type="file"], .toolbar select {
            background-color: var(--button-bg);
            color: var(--button-fg);
            border: none;
            padding: 6px 10px; /* Reduced padding */
            cursor: pointer;
            border-radius: 3px; /* Slightly smaller radius */
            font-size: 13px; /* Reduced font size */
        }
        .toolbar select {
            border: 1px solid var(--input-border);
            padding: 5px 4px; /* Adjusted to align better with buttons */
            width: 70px; /* Provide some base width */
        }

        .toolbar button:hover, .toolbar select:hover {
            background-color: var(--button-active-bg);
        }
        .toolbar button:disabled, .toolbar select:disabled {
            background-color: #555;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .toolbar button.active-mode {
            background-color: var(--button-mode-active-bg);
            box-shadow: 0 0 4px var(--button-mode-active-bg); /* Smaller shadow */
        }
        .toolbar select option {
            background-color: var(--modal-bg); /* Use modal background for dropdown items for contrast */
            color: var(--text-color);
        }


        .toolbar .file-input-label {
            display: inline-block;
             background-color: var(--button-bg);
            color: var(--button-fg);
            border: none;
            padding: 6px 10px; /* Reduced padding */
            cursor: pointer;
            border-radius: 3px; /* Slightly smaller radius */
            font-size: 13px; /* Reduced font size */
        }
        .toolbar .file-input-label:hover {
             background-color: var(--button-active-bg);
        }

        .toolbar input[type="file"] {
            display: none;
        }

        .canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--canvas-bg);
            overflow: hidden; /* Important for pan/zoom */
            position: relative; /* For centering canvas content */
        }

        #imageCanvas {
            border: 1px solid var(--button-bg);
            cursor: crosshair;
            touch-action: none; /* Prevent default touch actions like scroll/zoom */
        }
         #imageCanvas.panning {
            cursor: grab;
        }

        .status-bar-flex-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 10px;
            background-color: var(--bg-color);
            color: var(--status-fg);
            border-top: 1px solid var(--button-bg);
            min-height: 20px;
        }

        .status-bar {
            flex-grow: 1;
            text-align: left;
            font-size: 13px;
            padding: 2px 5px;
            border-radius: 3px;
            background-color: transparent;
            color: var(--status-fg);
        }

        .status-bar.error {
            background-color: var(--status-error-bg);
            color: var(--status-fg);
        }
        .status-bar.success {
            background-color: var(--status-success-bg);
            color: var(--status-fg);
        }
        .status-bar.info {
            background-color: var(--button-active-bg);
            color: var(--status-fg);
        }

        .info-display-on-statusbar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 15px;
        }

        #filename-display, #dimensions-display {
            background-color: var(--canvas-bg);
            padding: 3px 7px;
            border-radius: 3px;
            font-size: 12px;
            color: var(--text-color);
        }


        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--modal-bg);
            margin: auto;
            padding: 20px; /* Slightly reduced padding */
            border: 1px solid var(--input-border);
            border-radius: 6px; /* Slightly smaller radius */
            width: 90%;
            max-width: 430px; /* Slightly smaller max-width */
            color: var(--text-color);
            box-shadow: 0 3px 6px rgba(0,0,0,0.3); /* Slightly smaller shadow */
        }
        .modal-content h2 {
            margin-top: 0;
            border-bottom: 1px solid var(--input-border);
            padding-bottom: 8px; /* Slightly reduced padding */
            font-size: 1.3em; /* Slightly smaller font */
        }
        .modal-content p {
            margin-bottom: 15px;
            font-size: 0.95em;
            line-height: 1.4;
            color: var(--text-color);
        }

        .modal-content .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px; /* Slightly reduced margin */
        }
        .modal-content .setting-item label {
            flex-basis: 50%;
            font-size: 0.9em; /* Slightly smaller font */
        }
        .modal-content .setting-item input[type="number"],
        .modal-content .setting-item input[type="color"],
        .modal-content .setting-item input[type="text"] {
            flex-basis: 45%;
            padding: 6px; /* Reduced padding */
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--input-border);
            border-radius: 3px; /* Slightly smaller radius */
            font-size: 0.9em; /* Slightly smaller font */
        }
         .modal-content .setting-item input[type="color"] {
            padding: 1px;
            height: 30px; /* Reduced height */
        }


        .modal-buttons {
            text-align: right;
            margin-top: 15px; /* Reduced margin */
        }
        .modal-buttons button {
             background-color: var(--button-bg);
            color: var(--button-fg);
            border: none;
            padding: 8px 12px; /* Reduced padding */
            cursor: pointer;
            border-radius: 3px; /* Slightly smaller radius */
            font-size: 13px; /* Reduced font size */
            margin-left: 8px; /* Reduced margin */
        }
         .modal-buttons button:hover {
            background-color: var(--button-active-bg);
        }
        .modal-buttons button.confirm-action-btn {
            background-color: var(--status-error-bg); /* Red for destructive actions */
            color: var(--status-fg);
        }
        .modal-buttons button.confirm-action-btn:hover {
            background-color: darkred; /* Darker red on hover */
        }


    </style>
</head>
<body>
    <div class="toolbar">
        <input type="file" id="loadImageInput" accept="image/*" multiple>
        <label for="loadImageInput" class="file-input-label" role="button" aria-label="Load Images">🖼️ open</label>
        <button id="saveImageBtn" title="Save Image (Ctrl+S)" disabled>💾 Save</button>
        <button id="undoBtn" title="Undo last number (Ctrl+Z)" disabled>↩️ Undo</button>
        <button id="pasteImageBtn" title="Paste Image from Clipboard (Ctrl+V)">📥 Paste</button>
        <button id="copyImageBtn" title="Copy current image with markers to clipboard" disabled>📋 Copy</button>

        <button id="prevImageBtn" title="Previous Image (Left Arrow)" disabled>◀</button>
        <select id="imageSelect" title="Select Image to view"></select>
        <button id="nextImageBtn" title="Next Image (Right Arrow)" disabled>▶</button>

        <button id="modeABtn" title="Activate Mode A for numbering">Mode A</button>
        <button id="modeBBtn" title="Activate Mode B for numbering">Mode B</button>

        <button id="resetZoomBtn" title="Reset Zoom and Pan (Ctrl+R)" disabled>🔍 Reset</button>
        <button id="clearAllImagesBtn" title="Clear all loaded images" disabled>🗑️ Clear</button>
        <button id="settingsBtn" title="Open Settings">⚙️ Settings</button>
    </div>

    <div class="canvas-container" id="canvasDropArea">
        <canvas id="imageCanvas"></canvas>
    </div>

    <div class="status-bar-flex-container">
        <div class="status-bar" id="statusBar" role="status" aria-live="polite">Ready</div>
        <div class="info-display-on-statusbar">
            <span id="filename-display">No file loaded</span>
            <span id="dimensions-display">- x - px</span>
        </div>
    </div>

    <div id="settingsModal" class="modal" role="dialog" aria-labelledby="settingsModalTitle" aria-hidden="true">
        <div class="modal-content">
            <h2 id="settingsModalTitle">Settings</h2>
            <div class="setting-item">
                <label for="fontSizeInput">Font Size (px):</label>
                <input type="number" id="fontSizeInput" min="1" value="40">
            </div>
            <div class="setting-item">
                <label for="circleRadiusInput">Circle Radius (px):</label>
                <input type="number" id="circleRadiusInput" min="1" value="30">
            </div>
            <div class="setting-item">
                <label for="fontColorInput">Font Color:</label>
                <input type="color" id="fontColorInput" value="#000000">
            </div>
            <div class="setting-item">
                <label for="circleFillColorAInput">Circle Fill (Mode A):</label>
                <input type="color" id="circleFillColorAInput" value="#FFFFFF">
            </div>
            <div class="setting-item">
                <label for="circleFillColorBInput">Circle Fill (Mode B):</label>
                <input type="color" id="circleFillColorBInput" value="#FF0000">
            </div>
            <div class="setting-item">
                <label for="circleOutlineColorInput">Circle Outline Color:</label>
                <input type="color" id="circleOutlineColorInput" value="#000000">
            </div>
             <div class="setting-item">
                <label for="fontFamilyInput">Font Family:</label>
                <input type="text" id="fontFamilyInput" value="Arial">
            </div>
            <div class="modal-buttons">
                <button id="cancelSettingsBtn" aria-label="Cancel settings changes">Cancel</button>
                <button id="saveSettingsBtn" aria-label="Save settings changes">Save & Close</button>
            </div>
        </div>
    </div>

    <div id="confirmModal" class="modal" role="dialog" aria-labelledby="confirmModalTitle" aria-hidden="true">
        <div class="modal-content">
            <h2 id="confirmModalTitle">Confirm Action</h2>
            <p id="confirmModalMessage">Are you sure?</p>
            <div class="modal-buttons">
                <button id="confirmModalCancelBtn" aria-label="Cancel action">Cancel</button>
                <button id="confirmModalConfirmBtn" class="confirm-action-btn" aria-label="Confirm action">Confirm</button>
            </div>
        </div>
    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
