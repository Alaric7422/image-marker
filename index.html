<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Numbering Web App</title>
    <style>
        :root {
            --bg-color: #222426;
            --toolbar-bg: #1c1d1f;
            --button-bg: #303336;
            --button-fg: #f0f0f0;
            --button-hover-bg: #3e4246;
            --button-active-bg: #4a4f54;
            --button-mode-active-bg: #3b82f6;
            /* Modern royal blue */
            --canvas-bg: #141517;
            --status-success-bg: #16a34a;
            --status-error-bg: #dc2626;
            --status-fg: #ffffff;
            --text-color: #f1f3f5;
            --input-bg: #2a2d30;
            --input-border: #44484d;
            --modal-bg: #222426;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            /* Dynamic viewport height for mobile browsers */
            overflow: hidden;
            /* Prevent body scroll */
            user-select: none;
            -webkit-user-select: none;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            padding: 3px 6px;
            background-color: var(--toolbar-bg);
            border-bottom: 1px solid var(--input-border);
            gap: 3px;
            z-index: 10;
            flex-shrink: 0;
        }

        .toolbar button,
        .toolbar input[type="file"],
        .toolbar select,
        .toolbar .file-input-label {
            background-color: var(--button-bg);
            color: var(--button-fg);
            border: 1px solid var(--input-border);
            padding: 3px 4px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 11.5px;
            font-weight: 500;
            line-height: 1.3;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
            white-space: nowrap;
        }

        .toolbar select {
            padding: 2px 3px;
            min-width: 45px;
            max-width: 75px;
            width: 65px;
            text-overflow: ellipsis;
        }

        .toolbar button:hover,
        .toolbar select:hover,
        .toolbar .file-input-label:hover {
            background-color: var(--button-hover-bg);
            border-color: #5a6068;
        }

        .toolbar button:active,
        .toolbar .file-input-label:active {
            transform: scale(0.97);
            background-color: var(--button-active-bg);
        }

        .toolbar button:disabled,
        .toolbar select:disabled {
            background-color: #26282a;
            border-color: #33363a;
            color: #6c7278;
            cursor: not-allowed;
            opacity: 0.6;
            transform: none;
        }

        .toolbar button.active-mode {
            background-color: var(--button-mode-active-bg);
            border-color: #60a5fa;
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 0 6px rgba(59, 130, 246, 0.5);
        }

        .toolbar select option {
            background-color: var(--modal-bg);
            color: var(--text-color);
        }

        .toolbar input[type="file"] {
            display: none;
        }

        .canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--canvas-bg);
            overflow: hidden;
            position: relative;
            touch-action: none;
        }

        #imageCanvas {
            border: none;
            cursor: crosshair;
            touch-action: none;
        }

        #imageCanvas.panning {
            cursor: grabbing;
        }

        .status-bar-flex-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 8px;
            background-color: var(--toolbar-bg);
            color: var(--status-fg);
            border-top: 1px solid var(--input-border);
            min-height: 20px;
            font-size: 11px;
            flex-shrink: 0;
        }

        .status-bar {
            flex-grow: 1;
            text-align: left;
            padding: 1px 4px;
            border-radius: 3px;
            background-color: transparent;
            color: var(--text-color);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-bar.error {
            background-color: var(--status-error-bg);
            color: #ffffff;
        }

        .status-bar.success {
            background-color: var(--status-success-bg);
            color: #ffffff;
        }

        .status-bar.info {
            background-color: transparent;
            color: #9ca3af;
        }

        .info-display-on-statusbar {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 8px;
            flex-shrink: 0;
        }

        #filename-display,
        #dimensions-display {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 10.5px;
            color: var(--text-color);
            white-space: nowrap;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(2px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--modal-bg);
            margin: auto;
            padding: 16px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            width: 90%;
            max-width: 380px;
            color: var(--text-color);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .modal-content h2 {
            margin-top: 0;
            border-bottom: 1px solid var(--input-border);
            padding-bottom: 6px;
            font-size: 1.15em;
        }

        .modal-content p {
            margin-bottom: 12px;
            font-size: 0.9em;
            line-height: 1.4;
            color: var(--text-color);
        }

        .modal-content .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 9px;
        }

        .modal-content .setting-item label {
            flex-basis: 55%;
            font-size: 0.85em;
        }

        .modal-content .setting-item input[type="number"],
        .modal-content .setting-item input[type="color"],
        .modal-content .setting-item input[type="text"] {
            flex-basis: 42%;
            padding: 4px 6px;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--input-border);
            border-radius: 4px;
            font-size: 0.85em;
        }

        .modal-content .setting-item input[type="color"] {
            padding: 1px;
            height: 26px;
            cursor: pointer;
        }

        .modal-buttons {
            text-align: right;
            margin-top: 14px;
            display: flex;
            justify-content: flex-end;
            gap: 6px;
        }

        .modal-buttons button {
            background-color: var(--button-bg);
            color: var(--button-fg);
            border: 1px solid var(--input-border);
            padding: 5px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
        }

        .modal-buttons button:hover {
            background-color: var(--button-hover-bg);
        }

        .modal-buttons button.confirm-action-btn {
            background-color: var(--status-error-bg);
            border-color: #ef4444;
            color: #ffffff;
        }

        .modal-buttons button.confirm-action-btn:hover {
            background-color: #b91c1c;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .toolbar {
                padding: 2px 4px;
                gap: 2px;
            }

            .toolbar button,
            .toolbar select,
            .toolbar .file-input-label {
                padding: 2.5px 5px;
                font-size: 10.5px;
            }

            .toolbar select {
                max-width: 58px;
                width: 55px;
            }

            .status-bar-flex-container {
                padding: 2px 6px;
                font-size: 10px;
            }

            #filename-display,
            #dimensions-display {
                font-size: 9.5px;
                padding: 1px 4px;
            }
        }

        @media (max-width: 480px) {
            .toolbar {
                gap: 2px;
                padding: 2px 3px;
                justify-content: center;
            }

            .toolbar button,
            .toolbar select,
            .toolbar .file-input-label {
                padding: 2px 4px;
                font-size: 9.5px;
                border-radius: 3px;
            }

            .toolbar select {
                max-width: 48px;
                width: 45px;
                font-size: 9.5px;
            }

            #dimensions-display {
                display: none;
                /* Hide dimensions on very small mobile to save space */
            }

            .modal-content {
                width: 94%;
                padding: 12px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>
    <div class="toolbar">
        <input type="file" id="loadImageInput" accept="image/*" multiple>
        <label for="loadImageInput" class="file-input-label" role="button" aria-label="Load Images">🖼️ Open</label>
        <button id="pasteImageBtn" title="Paste Image from Clipboard (Ctrl+V)">📥 Paste</button>
        <button id="saveImageBtn" title="Save Image (Ctrl+S)" disabled>💾 Save</button>
        <button id="copyImageBtn" title="Copy current image with markers to clipboard (Ctrl+C)" disabled>📋
            Copy</button>
        <button id="undoBtn" title="Undo last action (Ctrl+Z)" disabled>↩️ Undo</button>
        <button id="redoBtn" title="Redo last undone action (Ctrl+Y / Ctrl+Shift+Z)" disabled>↪️ Redo</button>

        <button id="prevImageBtn" title="Previous Image (Left Arrow)" disabled>◀</button>
        <select id="imageSelect" title="Select Image to view"></select>
        <button id="nextImageBtn" title="Next Image (Right Arrow)" disabled>▶</button>

        <button id="modeABtn" title="Activate Mode A for numbering (Key: A or 1)">Mode A</button>
        <button id="modeBBtn" title="Activate Mode B for numbering (Key: B or 2)">Mode B</button>

        <button id="resetZoomBtn" title="Reset Zoom and Pan (Ctrl+R / 0)" disabled>🔍 Reset</button>
        <button id="clearAllImagesBtn" title="Clear all loaded images" disabled>🗑️ Clear</button>
        <button id="settingsBtn" title="Open Settings">⚙️ Set</button>
    </div>

    <div class="canvas-container" id="canvasDropArea">
        <canvas id="imageCanvas"></canvas>
    </div>

    <div class="status-bar-flex-container">
        <div class="status-bar" id="statusBar" role="status" aria-live="polite">Ready</div>
        <div class="info-display-on-statusbar">
            <span id="filename-display">No file loaded</span>
            <span id="dimensions-display">- x - px</span>
        </div>
    </div>

    <div id="settingsModal" class="modal" role="dialog" aria-labelledby="settingsModalTitle" aria-hidden="true">
        <div class="modal-content">
            <h2 id="settingsModalTitle">Settings</h2>
            <div class="setting-item">
                <label for="fontSizeInput">Font Size (px):</label>
                <input type="number" id="fontSizeInput" min="1" value="40">
            </div>
            <div class="setting-item">
                <label for="circleRadiusInput">Circle Radius (px):</label>
                <input type="number" id="circleRadiusInput" min="1" value="30">
            </div>
            <div class="setting-item">
                <label for="fontColorInput">Font Color:</label>
                <input type="color" id="fontColorInput" value="#000000">
            </div>
            <div class="setting-item">
                <label for="circleFillColorAInput">Circle Fill (Mode A):</label>
                <input type="color" id="circleFillColorAInput" value="#FFFFFF">
            </div>
            <div class="setting-item">
                <label for="circleFillColorBInput">Circle Fill (Mode B):</label>
                <input type="color" id="circleFillColorBInput" value="#FF0000">
            </div>
            <div class="setting-item">
                <label for="circleOutlineColorInput">Circle Outline Color:</label>
                <input type="color" id="circleOutlineColorInput" value="#000000">
            </div>
            <div class="setting-item">
                <label for="fontFamilyInput">Font Family:</label>
                <input type="text" id="fontFamilyInput" value="Arial">
            </div>
            <div class="modal-buttons">
                <button id="cancelSettingsBtn" aria-label="Cancel settings changes">Cancel</button>
                <button id="saveSettingsBtn" aria-label="Save settings changes">Save & Close</button>
            </div>
        </div>
    </div>

    <div id="confirmModal" class="modal" role="dialog" aria-labelledby="confirmModalTitle" aria-hidden="true">
        <div class="modal-content">
            <h2 id="confirmModalTitle">Confirm Action</h2>
            <p id="confirmModalMessage">Are you sure?</p>
            <div class="modal-buttons">
                <button id="confirmModalCancelBtn" aria-label="Cancel action">Cancel</button>
                <button id="confirmModalConfirmBtn" class="confirm-action-btn"
                    aria-label="Confirm action">Confirm</button>
            </div>
        </div>
    </div>

    <script type="module" src="index.js"></script>
</body>

</html>
